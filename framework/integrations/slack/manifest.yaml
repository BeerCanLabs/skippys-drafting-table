_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Draftsman AI
  description: Read-Only Architecture Search & Guidance Bot for DRAFT & drafting-table
  background_color: "#1E293B"
  long_description: >
    Draftsman AI is the architecture search, dependency mapping, and compliance guidance bot
    for DRAFT. It allows developers, architects, and engineering managers to instantly query
    ports, database engines, runtime dependencies, and compliance controls across their organization's
    drafting-table catalog right from Slack.
features:
  bot_user:
    display_name: Draftsman AI
    always_online: true
  slash_commands:
    - command: /draft
      url: https://${DRAFTSMAN_HOST}/api/slack/command
      description: Query architecture, dependencies, runtime specs, or compliance controls
      usage_hint: "[query e.g. 'What port does Absence Service use?']"
      should_escape: false
    - command: /draftsman
      url: https://${DRAFTSMAN_HOST}/api/slack/command
      description: Get onboarding guidance for registering products in DRAFT
      usage_hint: "[topic or product name]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
      - im:history
settings:
  event_subscriptions:
    request_url: https://${DRAFTSMAN_HOST}/api/slack/events
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
