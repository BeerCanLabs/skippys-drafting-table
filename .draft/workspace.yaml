schemaVersion: "1.0"
workspace:
  name: skippys-drafting-table
  displayName: BeerCanLabs DRAFT Workspace
  companyName: BeerCanLabs

repository:
  provider: github
  owner: BeerCanLabs
  name: skippys-drafting-table
  defaultBranch: main

framework:
  source: https://github.com/getdraft/draftsman.git
  vendoredPath: .draft/framework
  updatePolicy: explicit
  updateWorkflow: enabled

paths:
  catalog: catalog
  configurations: configurations

requirements:
  # List the UIDs of workspace-scoped RequirementGroups that are active for this workspace.
  # Note: Workspace-activated groups must be explicitly listed here to take effect in
  # the catalog browser and validation. Always-on groups (activation: always) do not
  # need to be listed here.
  activeRequirementGroups: []
  requireActiveRequirementGroupDisposition: false

contribution:
  branchingStrategy: github-flow

# Optional company vocabulary lists. Declare lists gradually. Use advisory while
# onboarding and gated when the company wants validation to block non-standard values.
vocabulary: {}
