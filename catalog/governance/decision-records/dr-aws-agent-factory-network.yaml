name: 'AWS Agent Factory: Network Segmentation and Edge'
description: >-
  Cloudflare is the only way in: the ALB admits only Cloudflare IPv4 ranges. Service and agent
  subnets are separate tiers, and services find each other through Cloud Map. Agent subnet and
  security-group zero-egress isolation (E1/E6, GAP-248/GAP-262) is enforced and verified live.
