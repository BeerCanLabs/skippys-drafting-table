decisionRationale: |
  Decision: one front door. Public endpoints accept connections only from the identity-aware proxy (Cloudflare); the load
  balancer refuses all other sources, and no landing zone opens platform ingress to 0.0.0.0/0 (Design Authority A1, commit
  09b3ac0, 2026-09-28, TSK-043/GAP-052). Live: the factory-prod ALB security group admits ports 80/443 only from 15 IPv4 CIDRs,
  the Cloudflare ranges in submind-aws config/deploy.env FACTORY_INGRESS_CIDRS (checked against cloudflare.com/ips-v4 on
  2026-09-29). The edge proxy itself follows the existing edge decision 01M7GTBMQS-SZBH. landing-zones/aws/cloudflare.tf
  (#499, TSK-341) codifies the Cloudflare edge ruleset (Root Access App, /api/v1/hooks/* signature-verified webhook bypass,
  path-scoped OAuth 2.1 AS and /mcp rules, and the /.cf-fk-bypass/* URL rewrite + WAF block + header strip + post-Access Edge
  Worker for Bearer fk_ keys), gated on var.cloudflare_zone_id (not yet set in submind-aws config/deploy.env).
  Segmentation (landing-zones/aws network.tf and README): public service subnets (ALB, control plane, gatekeepers, console,
  garrison) reach the internet through the IGW. Private agent subnets enforce zero direct internet egress (E1/E6) with
  assignPublicIp=false.
  Remediated drift (GAP-248 / GAP-262): on 2026-11-15, route table factory-prod-agents-no-egress had an unmanaged 0.0.0.0/0
  IGW route and security group factory-prod-agents had a hand-added 0.0.0.0/0 egress rule. Fixed in agent-factory 7e29c41 and
  enforced by submind-aws deploy Definition of Done (#157, ef39557/0b13d7a). Re-verified live on 2026-11-18: route table
  factory-prod-agents-no-egress contains only 10.42.0.0/16 -> local and the S3 Gateway VPC endpoint (vpce-0be8c05c678a1ab36),
  and security group sg-0358084eadfbde755 (factory-prod-agents) permits egress strictly to ECS metadata (169.254.170.2:80),
  VPC DNS (10.42.0.2:53 TCP/UDP), VPC endpoints security group sg-0723824b3c55eaff3 and S3 prefix list pl-63a5400a (:443),
  control-plane sg-03ae7eb022cb95a13 (:8088), and gatekeeper-egress sg-0c1dfff8196ab0929 (:8081).
  Live VPC endpoints (5 interface plus the S3 gateway): s3, ecr.api, ecr.dkr, secretsmanager, logs, bedrock-runtime. Service
  discovery is the private DNS namespace factory.internal (Cloud Map: control-plane, gatekeeper-ingress, gatekeeper-egress,
  garrison).
  External dependencies: Cloudflare (edge and Access), Discord gateway, model & SaaS providers routed via gatekeeper-egress
  (AWS Bedrock, Anthropic, OpenAI, xAI, GitHub, Google Workspace, Notion, Tavily, Cloudflare API, Home Print, Closing Climb),
  IdPs and webhook senders.
  No NAT gateways: E1/E6 (landing-zones/aws/README.md).

