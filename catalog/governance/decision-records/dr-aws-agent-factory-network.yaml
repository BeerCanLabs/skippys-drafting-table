  - BeerCanLabs/submind-aws @3f7d9a5: OPERATIONS.md (Front door, No hand changes in AWS), config/deploy.env (FACTORY_INGRESS_CIDRS, FACTORY_ECS_ASSIGN_PUBLIC_IP)
  - Live AWS, read-only, account ending 2296, us-east-1, 2026-11-15: elbv2 describe-load-balancers/listeners, ec2 describe-security-groups (ALB and factory-prod-agents), describe-route-tables (factory-prod-agents-no-egress), describe-vpc-endpoints, servicediscovery; CloudTrail lookup-events for the unmanaged route and egress rule
  - Drafting table: decision record 01M7GTBMQS-SZBH (Cloudflare edge proxy)
