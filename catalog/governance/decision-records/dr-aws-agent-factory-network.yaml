name: 'AWS Agent Factory: Network Segmentation and Edge'
description: 'Cloudflare is the only way in: the ALB admits only Cloudflare IPv4 ranges. Service and agent
  subnets are separate tiers, and services find each other through Cloud Map. Live drift on the agent tier is
  recorded below: both network-layer barriers to E1 are down, with assignPublicIp=false as the remaining mitigation.'
