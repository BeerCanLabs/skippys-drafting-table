decisionRationale: |
  Decision: one front door. Public endpoints accept connections only from the identity-aware proxy (Cloudflare); the load
  balancer refuses all other sources, and no landing zone opens platform ingress to 0.0.0.0/0 (Design Authority A1, commit
  09b3ac0, 2026-09-28, TSK-043/GAP-052). Live: the factory-prod ALB security group admits ports 80/443 only from 15 IPv4 CIDRs,
  the Cloudflare ranges in submind-aws config/deploy.env FACTORY_INGRESS_CIDRS (checked against cloudflare.com/ips-v4 on
  2026-09-29). The edge proxy itself follows the existing edge decision 01M7GTBMQS-SZBH. The only route that skips
  Cloudflare Access is inbound webhooks, which must carry a verified sender signature (A1; the user's decision 2026-10-28,
  issue #32, option A).
  Segmentation (landing-zones/aws network.tf and README): public service subnets (ALB, control plane, gatekeepers) reach the
  internet through the IGW. Terraform declares the private agent route table with no routes, and the agents security group
  with only scoped egress, so that agents can reach only the control plane (8088), gatekeeper-egress (8081) and account-locked
  VPC endpoints (443). That is the intended enforcement of the egress invariant E1 (every outbound connection from cartridge
  code goes through gatekeeper-egress).
  Known gap, not compliant with E1/E6, and not in Terraform: live, route table factory-prod-agents-no-egress (associated with
  both agent subnets) has a 0.0.0.0/0 route to the IGW, created by a Terraform apply run as IAM user beercanlabs on
  2026-09-20 04:26 America/Phoenix; and security group factory-prod-agents has an all-protocol egress rule to 0.0.0.0/0, added
  by hand with aws-cli on 2026-09-25 09:59 America/Phoenix. Terraform does not remove unmanaged routes or standalone SG rules,
  so this drift survives deploys and contradicts OPERATIONS "No hand changes in AWS". Mitigation that is true today: agent
  tasks launch with FACTORY_ECS_ASSIGN_PUBLIC_IP=false, and the agent subnets do not map public IPs, so there is no working
  internet path yet.
  Live VPC endpoints (5 interface plus the S3 gateway): s3, ecr.api, ecr.dkr, secretsmanager, logs, bedrock-runtime. Service
  discovery is the private DNS namespace factory.internal (Cloud Map). Inter-service connections follow the traffic matrix in
  landing-zones/aws/README.md, compared against live security-group rules for the agents group as above; the ALB group matches
  the Cloudflare ingress list.
  External dependencies: Cloudflare (edge and Access), Discord gateway, model providers (AWS Bedrock; xAI and OpenAI
  subscriptions through gatekeeper-egress), IdPs and webhook senders (README "Services Egress").
  No NAT gateways: E1/E6 (landing-zones/aws/README.md).

