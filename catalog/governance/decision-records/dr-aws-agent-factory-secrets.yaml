linkedObject: 01M15NEKT7-S14J
decisionRationale: |
  Decision: agents never hold real secrets (Design Authority S1). A cartridge's declared secrets reach it only as placeholders
  (its run token); gatekeeper-egress injects the real credential into the matching outbound request; the control plane and
  gatekeeper-egress redact every known secret value from results and ledger rows. OAuth grants and refresh tokens are held
  only by the Keymaster (K1-K3). Git holds secret names only (agent-factory AGENTS.md "Secrets"). Unbound required names fail
  with HTTP 412.
  Store: AWS Secrets Manager in us-east-1 (live: 96 secrets under factory/prod/ and closing-climb/prod/; names and counts
  only were read), referenced by ECS task definitions and reached from agent subnets through the secretsmanager VPC endpoint.
  Terraform generates every factory credential, one per caller-to-callee edge (landing-zones/aws/README.md "Secrets").
  Known, registered exceptions (agent-factory packages/conformance/baseline.json): GAP-031 (some agent task definitions
  still inject real secret values, for example agent-higgins' two form-login secrets, pending gatekeeper exchange routes)
  and GAP-050 (Terraform generates platform tokens and keeps their values in state, pending a Keymaster bootstrap design).

  Sources:
  - BeerCanLabs/agent-factory @01720b2: DESIGN_AUTHORITY.md 6.3.2 S1, 6.11 K1-K5; AGENTS.md (Secrets); landing-zones/aws/README.md, secrets.tf; packages/conformance/baseline.json
  - BeerCanLabs/SM-higgins cartridge.yaml (secrets.requires comments)
  - Live AWS, read-only, account ending 2296, us-east-1, 2026-11-15: secretsmanager list-secrets (names and counts only, no values), ecs describe-task-definition (secret reference counts)
