name: 'AWS Agent Factory: Secrets Management'
description: Design intent (S1) is that secrets stay in AWS Secrets Manager, with names only in git, and
  that gatekeeper-egress injects credentials so agents hold only a run token. On AWS that intent is not
  fully in force; GAP-031 is recorded below. OAuth grants are held by the Keymaster.
