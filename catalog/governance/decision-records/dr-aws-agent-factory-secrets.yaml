decisionRationale: |
  Design intent (Design Authority S1): agents never hold real secrets. A cartridge's declared secrets reach it only as
  placeholders (its run token); gatekeeper-egress injects the real credential into the matching outbound request; the control
  plane and gatekeeper-egress are meant to redact every known secret value from results and ledger rows. OAuth grants and
  refresh tokens are held only by the Keymaster (K1-K3). Git holds secret names only (agent-factory AGENTS.md "Secrets").
  Unbound required names are intended to fail with HTTP 412.
  Store: AWS Secrets Manager in us-east-1 (live: 96 secrets under factory/prod/ and closing-climb/prod/; names and counts
  only were read), referenced by ECS task definitions and reached from agent subnets through the secretsmanager VPC endpoint.
  Terraform generates every factory credential, one per caller-to-callee edge (landing-zones/aws/README.md "Secrets").
  AWS reality, DESIGN_AUTHORITY GAP-031 (Critical, S1 coverage partial, TSK-024 PENDING): since 6256fac (2026-09-20) the
  control plane skips secret binding for non-local runtimes, so it neither pre-flights them (no 412) nor knows their values
  to redact them from results and the ledger. The gap's scope covers Discord bot tokens, XAI_API_KEY, ANTHROPIC_API_KEY,
  GitHub tokens, a username/password pair and GCP service-account JSON, not only a couple of form-login secrets. Live, 11
  active agent task-definition families still carry secret references (agent-higgins, factory-prod-agent-echo-agent, and
  nine agent-<uuid> families). packages/conformance/baseline.json also records GAP-031 (agent task definitions inject real
  secret values, pending gatekeeper exchange routes) and GAP-050 (Terraform generates platform tokens and keeps their values
  in state, pending a Keymaster bootstrap design).

  Sources:
  - BeerCanLabs/agent-factory @01720b2: DESIGN_AUTHORITY.md 6.3.2 S1, 6.11 K1-K5, gap register GAP-031; AGENTS.md (Secrets); landing-zones/aws/README.md, secrets.tf; packages/conformance/baseline.json
  - BeerCanLabs/SM-higgins cartridge.yaml (secrets.requires comments)
  - Live AWS, read-only, account ending 2296, us-east-1, 2026-11-15: secretsmanager list-secrets (names and counts only, no values), ecs list/describe-task-definition (secret reference names and counts only, no values)
