name: 'AWS Agent Factory: Secrets Management'
description: Secrets are kept in AWS Secrets Manager, with names only in git. Gatekeeper-egress injects
  credentials, so agents hold only a run token. OAuth grants are held by the Keymaster.
version: 1.0.0
category: decision
status: accepted
catalogStatus: complete
lifecycleStatus: preferred
