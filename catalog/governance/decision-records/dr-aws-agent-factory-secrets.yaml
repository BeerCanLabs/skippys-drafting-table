linkedObject: 01M15NEKT7-S14J
decisionRationale: |
  Design intent (Design Authority S1): agents never hold real secrets. A cartridge's declared secrets reach it only as
  placeholders (its run token); gatekeeper-egress injects the real credential into the matching outbound request; the control
  plane and gatekeeper-egress redact known secret values from results and ledger rows. OAuth grants, refresh tokens, and
  short-lived GitHub App installation tokens (#502, TSK-343) are held and minted by the Keymaster (K1-K3). Git holds secret
  names only (agent-factory AGENTS.md "Secrets"). Unbound required names fail with HTTP 412.
  Store: AWS Secrets Manager in us-east-1 (live 2026-11-18: 104 secrets under factory/prod/ and closing-climb/prod/; names and
  counts only were read), accessed by packages/secrets-bind through the official AWS SDK (#509, K6, TSK-350) and referenced by
  ECS task definitions (control-plane 6, gatekeeper-ingress 2, gatekeeper-egress 2, garrison 1, console 0).
  Remaining registered gaps in packages/conformance/baseline.json: GAP-031 (legacy/non-migrated secret references on specific
  cartridge task definitions pending full gatekeeper exchange coverage; note active agent-higgins container definition now has
  0 container secret references on 2026-11-18) and GAP-050 (Terraform generates platform bootstrap tokens and stores values in
  encrypted S3 tfstate, pending a Keymaster bootstrap design).

  Sources:
  - BeerCanLabs/agent-factory @540a656: DESIGN_AUTHORITY.md 6.3.2 S1, 6.11 K1-K6, GAP-031, GAP-050, GAP-269, GAP-270; packages/secrets-bind (#509); packages/keymaster (#502); landing-zones/aws/secrets.tf; packages/conformance/baseline.json
  - BeerCanLabs/submind-aws @785e44c: config/deploy.env (FACTORY_GATEKEEPER_EGRESS_ROUTES, FACTORY_EXTRA_GATEKEEPER_EGRESS_ROUTES)
  - Live AWS, read-only, account 566332862296, us-east-1, 2026-11-15 and 2026-11-18: secretsmanager list-secrets (count=104, no values), ecs describe-task-definition (secret counts only, no values)
