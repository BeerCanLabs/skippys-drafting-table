name: 'AWS Agent Factory: Identity and Access Control'
description: People get operator identity only from a verified Cloudflare Access assertion or the factory's
  own login. Machines use factory tokens. Agents get per-run tokens and per-agent IAM roles. Everything
  is deny by default.
