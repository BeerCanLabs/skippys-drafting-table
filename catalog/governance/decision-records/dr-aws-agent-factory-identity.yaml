name: 'AWS Agent Factory: Identity and Access Control'
description: >-
  People get operator identity from verified Cloudflare Access assertions, factory login, or the
  embedded OAuth 2.1 Authorization Server (PKCE, RFC 9728 PRM). Machines use scoped fk_ tokens;
  agents get short-lived per-run tokens and own-prefix IAM roles (AgentTaskRole-<agent>).
