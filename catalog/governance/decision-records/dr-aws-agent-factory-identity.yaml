decisionRationale: |
  Decision: identity is verified, not asserted (Design Authority A2). The control plane grants a role only from a scoped
  factory API/OAuth token (fk_ / fk_at_ / fk_rt_), a short-lived HS256 run token (FACTORY_RUN_TOKEN), or the Cloudflare Access
  RS256 assertion checked against the team domain's certs, issuer and audience; the cf-access-authenticated-user-email header
  grants nothing. Embedded OAuth 2.1 Authorization Server (packages/auth, #497, TSK-339) serves /.well-known/oauth-protected-resource
  (RFC 9728 PRM), /.well-known/oauth-authorization-server, dynamic client registration, PKCE authorization + consent screen,
  and durable refresh rotation for external MCP clients (Claude, Cursor, CLI).
  Cloudflare Access covers agent-factory.beercanlabs.com and garrison.dalesackrider.com; factory-dashboard.dalesackrider.com
  uses a documented Access bypass (OPERATIONS.md, 2026-11-03) so the factory enforces its own login/OAuth flow while the ALB
  still admits only Cloudflare CIDRs.
  Authorization is default-deny and server-side: an agent with no admin-set policy has no egress (E7), POST /mcp/run separates
  agent-run MCP tools from principal /mcp (#488, TSK-337), and console/API/MCP actions ask the Bouncer for named privileges.
  AWS IAM (iam.tf, packages/property-manager/src/aws/iam.ts): remediated in commit 88a9847 (GAP-249/GAP-263) and re-verified
  live on 2026-11-18 — active AgentTaskRole-<agent> roles (e.g. AgentTaskRole-higgins) carry only MindPersistenceAccess scoped
  strictly to <agent>-state/* in agent-factory-mind-prod-924cfefd, and retired AgentTaskRole-<uuid> roles have zero policies.
  The control plane may RunTask for factory-prod-agent-* and agent-* task definition families and is denied provider keys.
  Production deploys assume factory-deploy via GitHub OIDC (submind-aws main); observed break-glass exceptions are recorded in
  01M7GYV3B6-Q5NV.
  Not covered here: admin MFA policy and edge/API rate-limiting thresholds are not yet documented in the catalog.

