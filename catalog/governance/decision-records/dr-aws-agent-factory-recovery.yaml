linkedObject: 01M15NEKT7-S14J
decisionRationale: |
  Availability (agent-factory .draft/sdp.yaml notes.availabilityRequirement): the mailboxes (ingress, control plane,
  gatekeeper-ingress) are always reachable and agent compute is zero when idle; "availability of the fleet is the mailbox, not
  warm agents". Each service runs one task. A control-plane deploy has a brief gap because it deploys stop-then-start (LG1,
  accepted 2026-09-28).
  Failure domain: platform-wide. Everything runs in one region (us-east-1) and one ECS cluster. Losing the control plane
  blocks wakes and MCP; losing one agent task does not take down the factory (repo SDP notes.failureDomain).
  Recovery (Design Authority R1): the factory's own state is backed up automatically and restorable to an earlier point.
  AWS binding: EFS automatic backups run daily (live: backup plan aws/efs/automatic-backup-plan, cron 05:00 UTC, 35-day
  retention; storage.tf aws_efs_backup_policy, commit bd94490, TSK-051/GAP-058). The config bucket is versioned with
  non-current versions kept for at least 90 days. Ledger checkpoints are WORM for 365 days. A failed ledger is archived, never
  repaired (LG2), and submind-aws has a documented ledger-recovery deploy.
  No SLO or error-budget policy is defined, and no cross-region recovery is recorded. (rationale not recorded)

