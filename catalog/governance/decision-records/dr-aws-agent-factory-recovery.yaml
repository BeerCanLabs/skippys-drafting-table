name: 'AWS Agent Factory: Availability, Failure Domain and Recovery'
description: Always-on mailboxes with zero idle agent compute. A single region and single cluster form
  the failure domain. EFS is backed up daily (35 days), the config bucket keeps versions for at least
  90 days, and the ledger keeps WORM checkpoints for 365 days.
