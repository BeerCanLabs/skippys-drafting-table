linkedObject: 01M15NEKT7-S14J
decisionRationale: |
  Decision: audit is the ledger. Every egress request writes a ledger row (agent, run, route or host, allow/deny), never prompt
  bodies or secrets (E3); the ledger is append-only, single-writer and verified (6.10). Secret values are redacted from
  results and ledger rows (S1). Webhook deliveries that are unsigned or carry a bad signature are refused, all in the same
  way (A1). The kernel builds no dashboards and serves telemetry through headless APIs (6.5).
  AWS binding: container logs go to CloudWatch Logs /ecs/factory-prod with 30-day retention (storage.tf). Container Insights
  is enabled on the cluster (ecs.tf). An ADOT collector sidecar next to the control plane and gatekeeper-egress turns OTLP
  into CloudWatch metrics (README "Metrics").
  Observed gaps: application log lines are plain text with component prefixes (for example "[subscriptions] ..."), not JSON
  with trace/span IDs. No CloudWatch alarms or dashboards exist for the factory (live: all 7 alarms belong to Closing Climb).
  Why, for both: rationale not recorded.

