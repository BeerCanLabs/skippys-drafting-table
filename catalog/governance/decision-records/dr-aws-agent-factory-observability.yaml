name: 'AWS Agent Factory: Observability and Audit Logging'
description: The ledger is the structured audit trail. CloudWatch Logs (30 days), Container Insights and
  an ADOT collector carry operational telemetry. The kernel exposes telemetry through headless APIs, not
  dashboards.
