name: 'AWS Agent Factory: Model Access and AI Gateway Routing'
description: >-
  Every model call goes through gatekeeper-egress (the factory model API and provider routes),
  where it is metered, budgeted and policy-gated. Direct Bedrock IAM policies were removed from
  AgentTaskRole-* roles (GAP-249/GAP-263). Model choice and budgets are factory policy, not code.
