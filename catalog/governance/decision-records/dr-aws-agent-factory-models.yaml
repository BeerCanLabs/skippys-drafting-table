name: 'AWS Agent Factory: Model Access and AI Gateway Routing'
description: Every model call goes through gatekeeper-egress (the factory model API), where it is metered,
  budgeted and policy-gated. Bedrock is reached through the gatekeeper-egress task role and a VPC endpoint.
  Model choice and budgets are factory policy, not code.
