name: 'AWS Agent Factory: Model Access and AI Gateway Routing'
description: Design intent is that every model call goes through gatekeeper-egress (the factory model API),
  where it is metered, budgeted and policy-gated. Live agent task roles can also invoke Bedrock directly,
  which bypasses that metering. Model choice and budgets are factory policy, not code.
