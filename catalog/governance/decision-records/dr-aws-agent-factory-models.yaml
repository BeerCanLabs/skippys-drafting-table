decisionRationale: |
  Decision: one factory model API (M1). Agents call models through gatekeeper-egress in the OpenAI Chat Completions format or
  configured LLM routes, never call a provider directly and never hold provider credentials (E1, E5, S1). Every model call
  goes through a gatekeeper-egress route so tokens and cost are metered and ledgered; CONNECT tunnels are not accepted for
  model calls (E5). gatekeeper-egress (with packages/executive) enforces routes, models, Accountant budgets, the kill switch
  and Bouncer approvals before forwarding (E4), and exposes POST /internal/vendor-models to the control plane so vendor model
  discovery never leaks provider keys (S1). gatekeeper-egress therefore acts as this deployment's AI gateway; no separate
  ai_gateway catalog object exists.
  AWS binding: the models route translates calls to Bedrock Converse, signed by the gatekeeper-egress task role, which has
  bedrock:InvokeModel on foundation models and this account's inference profiles (iam.tf). Direct provider routes configured in
  submind-aws config/deploy.env also proxy Anthropic (api.anthropic.com), OpenAI (api.openai.com), and xAI (api.x.ai) using
  Gatekeeper-injected secrets or Keymaster-managed subscriptions (M5).
  Remediated IAM bypass (GAP-249 / GAP-263): on 2026-11-15, runtime-created AgentTaskRole-* roles carried BedrockConverseAccess
  and AgentBedrockModelInvocation, allowing direct Bedrock calls over the bedrock-runtime VPC endpoint. Fixed in agent-factory
  88a9847 and verified by submind-aws deploy perimeter simulation (#157, a113fc4). Re-verified live on 2026-11-18:
  AgentTaskRole-higgins carries only MindPersistenceAccess (zero Bedrock policies), and retired AgentTaskRole-<uuid> roles have
  zero policies attached. Legacy repository notes on GAP-027/GAP-041 remain tracked in DESIGN_AUTHORITY.md.
  Model specification: the owner chooses approved, primary and secondary models, and an admin sets per-agent budgets, as
  factory configuration rather than code (M2, M3, E7). Cartridges name no model. Unpriced models are refused.
  The Terraform default model_catalog offers claude-sonnet-4-5, claude-haiku-4-5, claude-sonnet-4-6 and claude-opus-4-6 on
  Bedrock. The live catalog and per-agent policies are runtime factory data and were not read.

