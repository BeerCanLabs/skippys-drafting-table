name: 'AWS Agent Factory: Data Stores and Data Classification'
description: Agent memory is kept in S3 under per-agent prefixes. The ledger is on encrypted EFS with
  WORM checkpoints in S3 Object Lock. Configuration is in a versioned S3 bucket. The factory runs no relational
  or query database.
