linkedObject: 01M15NEKT7-S14J
decisionRationale: |
  Decision: agent memory follows "The Notebook & Safe" (Design Authority 6.6). Cartridges read and write local SQLite in
  $MEMORY_DIR and never import cloud SDKs; the Property Manager's hydrate shim pulls the mind from object storage on wake and
  pushes it back on sleep. AWS binding: S3 bucket agent-factory-mind-prod-924cfefd with per-agent prefixes (<agent>-state/*).
  Remediated IAM gap (GAP-249 / GAP-263): on 2026-11-15, runtime-created AgentTaskRole-* roles allowed access across the entire
  mind bucket. Fixed in agent-factory 88a9847 and verified by submind-aws deploy perimeter simulation (#157, a113fc4). Live IAM
  re-verified on 2026-11-18: active named roles (e.g. AgentTaskRole-higgins) carry only MindPersistenceAccess scoped strictly
  to arn:aws:s3:::agent-factory-mind-prod-924cfefd/<agent>-state/* (and s3:ListBucket conditioned on <agent>-state/*), while
  retired AgentTaskRole-<uuid> roles have zero inline or attached policies.
  The ledger hot chain (01M7QAES9Q-10ZE) is on EFS factory-prod-ledger with one writer (LG1); checkpoints ship to
  agent-factory-ledger-prod-924cfefd (01M7QAES9Q-M4R9) with S3 Object Lock in COMPLIANCE mode, 365-day default retention, so no
  principal can delete or overwrite them early (storage.tf; live configuration). Each agent's deployment configuration is one
  immutable object per version in agent-factory-config-prod-924cfefd (6.14 SK3, R1). Skill packages are in
  agent-factory-packages-prod-924cfefd.
  Classification: Confidential. The ledger holds metadata and hashes only, and the mind holds adopter data (agent-factory
  .draft/sdp.yaml notes.dataClassification). The ledger never holds secrets or prompt bodies (AGENTS.md definition of done 4).
  SQL scope: the factory kernel has no SQL engine in packages/*/src. The cartridge runtime this SDP places
  (01M7GWXKXW-4ZJF, runtimes/agent-runtime, modeled as data component 01M7QAES9Q-FFCP) does: memory/episodic.py,
  memory/notebook.py and memory/workspace.py create a SQLite schema (CREATE TABLE / CREATE INDEX / FTS5) for conversations,
  notebook metadata and workspace state. Schema changes ship in that runtime as CREATE TABLE IF NOT EXISTS and index creation;
  notebook rotation copies the schema onto a new file and swaps it in. There is no expand-and-contract migration decoupled from
  a runtime deploy, so req-expand-contract-migrations remains not-compliant. Query values are bound with parameterized
  placeholders throughout; the only string-built SQL is notebook.py interpolating table identifiers from carry_tables (not
  passed by runtime/mind.py), so req-asvs-parameterized-queries is satisfied. DynamoDB closing-climb-prod in the same account
  belongs to Closing Climb, not the factory.

