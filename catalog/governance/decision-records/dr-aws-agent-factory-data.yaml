name: 'AWS Agent Factory: Data Stores and Data Classification'
description: Agent memory is kept in S3 under per-agent prefixes and, while a task is running, as per-agent
  SQLite in the agent-runtime notebook. The ledger is on encrypted EFS with WORM checkpoints in S3 Object Lock.
  Configuration is in a versioned S3 bucket. Runtime-created agent roles are not limited to their own mind prefix.
