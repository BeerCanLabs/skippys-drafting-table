name: 'AWS Agent Factory: Data Stores and Data Classification'
description: >-
  Agent memory is kept in S3 under per-agent prefixes and, while a task is running, as per-agent
  SQLite in the agent-runtime notebook. The ledger is on encrypted EFS with WORM checkpoints in S3
  Object Lock. Configuration and skill packages live in versioned S3 buckets. Per-agent S3 prefix
  isolation on AgentTaskRole-* roles (GAP-249/GAP-263) is enforced and verified live.
