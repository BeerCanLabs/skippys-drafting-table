decisionRationale: |
  IaC (observed): the factory landing zone is Terraform in agent-factory landing-zones/aws (S3 backend), applied only by the
  submind-aws deploy-aws workflow on main through a GitHub OIDC role; "No hand changes in AWS" (OPERATIONS.md Rules). One
  documented manual exception: the Cloudflare Access console bypass set by hand on 2026-11-03 while cloudflare.tf is off
  (OPERATIONS.md). The landing zone is a single Terraform root configuration, not a set of composable modules.
  Release: deploys ship only commits on agent-factory main with green CI, tagged by commit SHA, never :latest (DA 6.7).
  Garrison is pinned by digest (deploy.env). The deploy fails unless its definition of done passes. Each OPERATIONS.md deploy
  entry records a rollback pin (a previous agent-factory commit). Rollback means redeploying that pin by hand. Live ECS
  deployment circuit breakers are disabled. Services roll out 100/200 except the control plane, which deploys stop-then-start
  (min 0 / max 100) so the ledger never has two writers (LG1, accepted 2026-09-28; ecs.tf comment; conformance fails if it
  changes).
  Gates: CI runs npm test (including packages/conformance, which machine-checks Design Authority invariants), contract
  validation and compose-proof (an ephemeral Docker Compose end-to-end run). A pre-push hook runs scripts/conformance.sh;
  never bypass it and never skip tests (AGENTS.md). Known violations may be baselined only with the user's approval and a
  registered gap: packages/conformance/baseline.json has 4 entries (GAP-031, GAP-050). No SAST, secret scanning, dependency
  (SCA) scanning or IaC policy linting runs in agent-factory CI, and there is no Dependabot configuration. Why: rationale
  not recorded. There are no per-branch cloud preview environments.
  Registration: the product is registered in this drafting table as 01M1N137Q5-AFAC with sdpManifest .draft/sdp.yaml.

