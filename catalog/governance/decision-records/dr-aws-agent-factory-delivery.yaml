name: 'AWS Agent Factory: Infrastructure as Code, Delivery and Quality Gates'
description: All AWS changes go through Terraform and an ops-repo pipeline that deploys only pinned, CI-green
  SHAs. Conformance tests enforce design invariants. Known exceptions are registered and listed below.
