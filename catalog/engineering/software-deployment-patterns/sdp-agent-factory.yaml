schemaVersion: '1.0'
uid: 01M15NEKT7-S14J
type: software_deployment_pattern
name: BeerCanLabs Agent Factory Deployment Pattern
aliases:
- Skippy's Submind Agent Factory Deployment Pattern
- BeerCanLabs Agent Factory
description: >-
  Production AWS ECS Fargate deployment pattern for BeerCanLabs Agent Factory (cluster
  factory-prod, us-east-1): Headless Neck & Cast kernel mailboxes, zero-secret Web Console
  and Factory CLI heads, scale-to-zero Shared Cartridge Runtime and House Staff tasks in
  zero-egress agent subnets, and five first-party durable data components across encrypted
  EFS and four S3 stores (WORM Object Lock Ledger, Deployment Configs, Skill Packages, and
  Agent Mind Safe).
version: 2.0.0
catalogStatus: incomplete
lifecycleStatus: preferred
