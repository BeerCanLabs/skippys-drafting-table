businessContext:
  productFamily: Skippy / Agent Factory
networkZones:
- id: edge
  name: Edge & Identity-Aware Ingress
  tier: frontend
  description: >-
    Cloudflare edge proxy, Cloudflare Access, and HTTPS AWS ALB restricted to Cloudflare IPv4
    ingress CIDRs (see decision records 01M7GTBMQS-SZBH and 01M7GYV3B6-8VN0).
- id: mailbox
  name: Mailbox, Headless Neck & Console Services
  tier: application
  description: >-
    Public service subnets hosting Control Plane (:8088/:8089), Gatekeeper Ingress (:8090),
    Gatekeeper Egress (:8081), and Web Console (:3000) under Cloud Map DNS (factory.internal).
- id: agents
  name: Zero-Egress Agent Cartridge Compute
  tier: application
  description: >-
    Private agent subnets with zero direct internet egress (factory-prod-agents-no-egress has
    only local VPC and S3 Gateway endpoint routes; security group factory-prod-agents permits
    egress only to Control Plane :8088, Gatekeeper Egress :8081, VPC endpoints :443, VPC DNS :53,
    and ECS metadata :80; assignPublicIp=false — see decision record 01M7GYV3B6-8VN0).
- id: data
  name: Durable Mind, WORM Ledger, Config & Skill Storage
  tier: data
  description: >-
    Encrypted EFS single-writer hot ledger volume (:2049) and four dedicated S3 buckets for
    COMPLIANCE WORM ledger checkpoints, versioned agent configs, skill packages, and agent minds.
