acceptableUsePolicy:
  mandatory: true
  policy: All public web endpoints across Submind and client workloads MUST be fronted by Cloudflare Global Anycast Edge Proxy ($0 Free Tier). Bare GHS CNAME mappings and unproxied origin endpoints are strictly non-compliant.
requirements:
- id: req-edge-proxy-mandatory
  description: Every public website or web service MUST be fronted by an External Anycast Edge Proxy Service (Cloudflare Free Tier or compliant Managed Edge Proxy). Direct bare host mappings (such as ghs.googlehosted.com) without ALPN-compliant edge TLS proxying are strictly prohibited.
  canBeSatisfiedBy:
  - mechanism: field
    key: networkService
  - mechanism: decisionRecord
    key: edgeProxyDecision
  minimumSatisfactions: 1
  requirementMode: mandatory
  naAllowed: false
  validAnswerTypes:
  - field
  - decisionRecord
